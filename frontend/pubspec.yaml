name: groundink
description: "groundink — visually grounded spelling feedback for handwritten learner input (fully offline)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  onnxruntime: ^1.4.1
  image: ^4.0.17
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/word_detection_model.onnx
    - assets/models/char_model_nano_704.onnx
    - assets/models/english_words.json
